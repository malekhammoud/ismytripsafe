name: ci

on:
  push:
    branches: [main, beta]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NIGHTLIFE_INDEXABLE: "0"
      NIGHTLIFE_SITE_URL: "https://ismytripsafe.com"
      NIGHTLIFE_CACHE_DIR: "${{ github.workspace }}/.nightlife-ci"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:nightlife
