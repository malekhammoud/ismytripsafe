# Nightlife SEO drop-in for ismytripsafe-beta.service.
#
# The nightlife pilot lives on the beta origin while production is untouched.
# Enable indexing here (not by merging beta into main) so Google sees one
# canonical host for these pages: https://beta.ismytripsafe.com/...
#
# Install:
#   mkdir -p /etc/systemd/system/ismytripsafe-beta.service.d
#   cp deploy/ismytripsafe-beta-nightlife-seo.conf \
#      /etc/systemd/system/ismytripsafe-beta.service.d/nightlife-seo.conf
#   systemctl daemon-reload && systemctl restart ismytripsafe-beta
[Service]
Environment=NIGHTLIFE_INDEXABLE=1
Environment=NIGHTLIFE_SITE_URL=https://beta.ismytripsafe.com
